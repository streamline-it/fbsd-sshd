---
- name: ensure jail it boolean variable is properly set
  ansible.builtin.assert:
    that: 
      - fbsd_sshd_jail_it is defined
      - fbsd_sshd_jail_it == true or fbsd_sshd_jail_it == false
    fail_msg: "boolean variable not set properly or not defined"

- name: check on jail variables
  when: fbsd_sshd_jail_it == true
  ansible.builtin.assert:
    that:
      - fbsd_sshd_jail_prepath is defined
      - fbsd_sshd_jail_prepath is truthy
      - fbsd_sshd_jail_name is defined
      - fbsd_sshd_jail_name is truthy
    fail_msg: "Key variables must be defined and have values"

- name: ensure needed variables are defined
  ansible.builtin.assert:
    that:
      - fbsd_sshd_security_directives is defined
      - fbsd_sshd_security_directives is truthy
      - fbsd_sshd_root_group is defined
      - fbsd_sshd_root_group is truthy
      - fbsd_sshd_svc is defined
      - fbsd_sshd_svc is truthy
      - fbsd_sshd_base_filename is defined
      - fbsd_sshd_base_filename is truthy
      - fbsd_sshd_security_filename is defined
      - fbsd_sshd_security_filename is truthy
      - fbsd_sshd_config_directory is defined
      - fbsd_sshd_config_directory is truthy
      - fbsd_sshd_main_config_filepath is defined
      - fbsd_sshd_main_config_filepath is truthy
      - fbsd_sshd_security_lines_to_disable is defined
      - fbsd_sshd_security_lines_to_disable is truthy
    fail_msg: "Make sure variables are defined and values set"


